name: tech_void
description: "TECH_VOID — Vietnamese tech e-commerce mobile app (TechStore). Dark neon-cyberpunk UI built on a Clean Architecture layered structure."
publish_to: "none"
version: 1.0.0+1


environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  jwt_decoder: ^2.0.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.1.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # State management (lightweight, course-friendly).
  provider: ^6.0.0

  # Webfonts matching the design system (VOID LUXE):
  #   Display = Archivo Expanded (bundled variable font, FontVariation wdth 125)
  #   Body = Be Vietnam Pro (bundled statics in google_fonts/ — no FOUT)
  #   Mono = JetBrains Mono (runtime fetch)
  google_fonts: ^6.0.0

  # --- VOID LUXE motion & polish stack ---
  # Declarative chained animations + stagger (entrances, sheen, ambient loops).
  flutter_animate: ^4.5.2
  # Skeleton loaders thay spinner generic (tự vẽ ghost từ layout thật).
  skeletonizer: ^2.1.3
  # Cache ảnh sản phẩm (disk+memory) + fade-in built-in.
  cached_network_image: ^3.4.1
  # OpenContainer morph (card -> detail) + FadeThrough page transitions.
  animations: ^2.2.0
  # Bộ icon Lucide thật (icon-font) thay Material glyphs đội lốt.
  lucide_icons_flutter: ^3.1.15

  # HTTP client used by the (swappable) API layer once the backend is ready.
  http: ^1.0.0

  # Google Sign-In for authentication
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  open_mail_launcher: ^0.2.0
  android_intent_plus: ^6.0.0
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  signalr_netcore: ^1.4.4
  # Staff chụp ảnh giao hàng (confirm-delivery) + upload ảnh sản phẩm.
  image_picker: ^1.2.3
  app_links: ^7.0.0
  # Lưu lựa chọn theme light/dark (VOID PAPER / VOID LUXE).
  shared_preferences: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/products/
    - assets/images/
    - assets/fonts/
    # Be Vietnam Pro statics: google_fonts package tự nhận bundle này thay vì
    # fetch mạng (đúng naming BeVietnamPro-<Weight>.ttf) -> hết flash-of-font.
    - google_fonts/

  fonts:
    # Archivo variable font (wdth 62-125, wght 100-900). Display styles dùng
    # FontVariation('wdth', 125) để ra Expanded — không cần static TTF riêng.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
