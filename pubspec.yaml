name: tech_void
description: "TECH_VOID — Vietnamese tech e-commerce mobile app (TechStore). Dark neon-cyberpunk UI built on a Clean Architecture layered structure."
publish_to: "none"
version: 1.0.0+1


environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  jwt_decoder: ^2.0.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.1.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # State management (lightweight, course-friendly).
  provider: ^6.0.0

  # Webfonts matching the design system:
  #   Display = Chakra Petch · Body = Be Vietnam Pro · Mono = JetBrains Mono
  google_fonts: ^6.0.0

  # HTTP client used by the (swappable) API layer once the backend is ready.
  http: ^1.0.0

  # Google Sign-In for authentication
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  open_mail_launcher: ^0.2.0
  android_intent_plus: ^6.0.0
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  signalr_netcore: ^1.4.4
  # Staff chụp ảnh xác nhận giao hàng (POST /confirm-delivery).
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/products/
